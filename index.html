<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <script>
    (function() {
      try {
        var storedTheme = localStorage.getItem('theme');
        var useDark = false;
        if (storedTheme === 'dark') {
          useDark = true;
        } else if (storedTheme === 'light') {
          useDark = false;
        } else {
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (systemDark) {
            useDark = true;
          }
        }
        if (useDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://aistudiocdn.com;">

  <style>
    * {
      scroll-behavior: smooth;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      color: #0a0a0a;
      overflow-x: hidden;
      /* Prevent horizontal scroll */
    }

    /* Loader dark mode compatibility */
    html.dark #initial-loader-wrapper {
      background-color: #030712 !important;
    }
    
    html.dark .loader {
      border-color: #1f2937 !important;
      border-bottom-color: #3b82f6 !important;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root">
    <div id="initial-loader-wrapper" style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f9fafb;">
      <style>
        .loader { width: 48px; height: 48px; border: 5px solid #e5e7eb; border-bottom-color: #3b82f6; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      <span class="loader"></span>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>
